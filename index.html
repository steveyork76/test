<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUNICA Accesorios | En Construcción</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-fondo: #7a5242;
      --color-claro: #e6d5c3;
      --color-texto: #fffaf7;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--color-fondo);
      color: var(--color-texto);
      font-family: 'Montserrat', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
      animation: fadeIn 1.5s ease;
    }

    img {
      max-width: 250px;
      height: auto;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    p {
      font-size: 1.2rem;
      color: var(--color-claro);
      margin-bottom: 2rem;
    }

    .moon {
      font-family: 'Great Vibes', cursive;
      font-size: 1.5rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo/logo.jpeg" alt="Logo LUNICA" />
    <h1>🌙 Estamos trabajando en algo especial</h1>
    <p class="moon">Pronto llegaremos con magia y estilo...</p>
    <p>&copy; 2025 LUNICA Accesorios</p>
  </div>
</body>
</html>
