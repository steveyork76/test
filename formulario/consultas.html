<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consultas - Lunica Accesorios</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    /* Estilos específicos para esta página */
    .formulario-consultas {
      max-width: 400px;
      margin: 2rem auto;
      background-color: #f3e7d9;
      padding: 1.5rem 2rem;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-family: 'Segoe UI', sans-serif;
      color: #5b352e;
    }

    .formulario-consultas label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .formulario-consultas input[type="text"],
    .formulario-consultas input[type="email"] {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1.2rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    .formulario-consultas button {
      width: 100%;
      padding: 0.7rem;
      background-color: #6e443d;
      color: #f3e7d9;
      border: none;
      border-radius: 25px;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .formulario-consultas button:hover {
      background-color: #805544;
    }

    .btn-volver {
      display: inline-block;
      margin: 2rem auto 0 auto;
      background-color: #6e443d;
      color: #f3e7d9;
      padding: 0.6rem 1.5rem;
      border-radius: 25px;
      font-weight: 600;
      text-decoration: none;
      font-size: 1rem;
      transition: background-color 0.3s ease;
      cursor: pointer;
      text-align: center;
    }
    .btn-volver:hover {
      background-color: #805544;
    }
  </style>
</head>
<body>

  <header>
    <img src="../img/1.png" alt="Logo Lunica Accesorios" style="border-radius: 5%;" />
  </header>

  <nav class="menu">
    <a href="../links/construccion/en_construccion.html"><i class="fa-solid fa-hat-cowboy"></i> Gorros</a>
    <a href="../links/construccion/en_construccion.html"><i class="fa-solid fa-hand-sparkles"></i> Mitones</a>
    <a href="../links/construccion/en_construccion.html"><i class="fa-solid fa-socks"></i> Calcetines</a>
    <a href="../links/construccion/en_construccion.html"><i class="fa-solid fa-bag-shopping"></i> Bandoleras</a>
    <a href="../links/construccion/en_construccion.html"><i class="fa-solid fa-grip-lines"></i> Straps</a>
    <a href="../links/construccion/en_construccion.html"><i class="fa-solid fa-wallet"></i> Billeteras</a>
    <a href="../links/construccion/en_construccion.html"><i class="fa-solid fa-recycle"></i> Ecobag</a>
    <a href="../links/construccion/en_construccion.html"><i class="fa-solid fa-snowflake"></i> Bufandas</a>    
    <a href="consultas.html"><i class="fa-solid fa-envelope"></i> Consultas</a>

  </nav>

  <section class="formulario-consultas">
    <h1>Formulario de Consultas</h1>
    <form action="https://formsubmit.co/ejorquec@email.com" method="POST">
      <label for="name">Nombre:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" required />

      <button type="submit">Enviar</button>
    </form>

    <a href="../index.html" class="btn-volver">
      <i class="fa-solid fa-arrow-left"></i> Volver al inicio
    </a>
  </section>

  <footer class="footer">
    <p>© LUNICA 2025 - Todos los derechos reservados.</p>
  </footer>

</body>
</html>
